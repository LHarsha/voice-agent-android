plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voiceagent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.voiceagent'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
    }

    // A fixed debug key so every build (yours or GitHub's) can update the
    // installed app without uninstalling first. Passwords are the standard
    // Android debug-key defaults; this key is only for personal sideloading.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
